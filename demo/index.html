<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRPL Digital Invite — Demo</title>
<style>
  body{margin:0;background:#101214;color:#e8e4dc;font-family:Georgia,serif;padding:40px 20px;}
  .wrap{max-width:660px;margin:0 auto;}
  h1{font-size:20px;letter-spacing:.12em;text-transform:uppercase;font-weight:normal;opacity:.7;margin-bottom:4px;}
  p{opacity:.6;font-size:14px;margin-bottom:24px;}
  code{background:#1e2226;padding:2px 6px;border-radius:3px;font-size:13px;}
  a{color:#e8883e;}
</style>
</head>
<body>
<div class="wrap">
  <h1>TRPL Digital Invite</h1>
  <p>Try adding <code>?name=Theodore%20Roosevelt</code> to the URL. &nbsp;<a href="../index.html">Open the builder →</a></p>

  <!-- Brand combination: Badlands Night -->
  <div data-trpl-invite
       data-card-image="sample-invitation.jpg"
       data-card-alt="David Hume Kennerly — In the Room, October 1, 2026"
       data-rsvp-url="https://www.trlibrary.com/"
       data-rsvp-text="RSVP"
       data-name-fallback="Friend of the Library"></div>
</div>

<script src="../dist/trpl-invite.js" defer></script>
</body>
</html>
